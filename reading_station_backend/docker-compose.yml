version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: reading_station_db
    environment:
      POSTGRES_DB: reading_station
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name reading_station_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
